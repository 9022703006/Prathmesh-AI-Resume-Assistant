
spring:
  application:
    name: ai-chatbot-backend

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.8-flash
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000ms
        multiplier: 2
        max-interval: 10000ms
      on-http-codes:
        - 503
      exclude-on-http-codes:
        - 400
        - 401
        - 403
        - 404

server:
  address: 0.0.0.0
  port: ${PORT:8000}
