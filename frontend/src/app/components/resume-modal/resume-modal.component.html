<div class="modal-backdrop" *ngIf="isOpen" (click)="onClose()" tabindex="-1">
  <div class="modal-container" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="resume-title">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-info">
        <div class="doc-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h2 id="resume-title" class="modal-title">Prathmesh Sanjay Patil – Resume</h2>
          <p class="modal-subtitle">PrathmeshResume.pdf • Official Curriculum Vitae</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-download" (click)="downloadResume()" title="Download PrathmeshResume.pdf">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download Resume</span>
        </button>

        <button type="button" class="btn-close" (click)="onClose()" title="Close resume viewer" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Modal Body with Embedded PDF Viewer -->
    <div class="modal-body">
      <iframe
        *ngIf="isOpen && safePdfUrl"
        [src]="safePdfUrl"
        class="pdf-frame"
        title="Prathmesh Sanjay Patil Resume PDF">
      </iframe>

      <div class="fallback-bar">
        <span>Displaying <strong>PrathmeshResume.pdf</strong>. Need an offline copy?</span>
        <a [href]="resumePath" download="PrathmeshResume.pdf" class="fallback-link">Direct Download Link</a>
      </div>
    </div>

  </div>
</div>
